    <style>
        :root {
            --navy: #0f1f3d;
            --navy-mid: #162848;
            --navy-light: #1e3560;
            --gold: #c9a84c;
            --gold-light: #e4c97e;
            --gold-pale: #f5e9c8;
            --cream: #faf8f3;
            --white: #ffffff;
            --text-dark: #1a1a2e;
            --text-mid: #4a5568;
            --text-light: #8896ab;
            --border: rgba(201, 168, 76, 0.2);
            --shadow-sm: 0 2px 8px rgba(15, 31, 61, 0.08);
            --shadow-md: 0 4px 20px rgba(15, 31, 61, 0.12);
            --shadow-lg: 0 8px 40px rgba(15, 31, 61, 0.18);
            --radius: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; scroll-behavior: smooth; background: #faf8f3 !important; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #faf8f3 !important;
            color: var(--text-dark);
        }

        .wrapper { min-height: 100%; display: flex; flex-direction: column; background: #faf8f3 !important; }
        .batch-panel, .students-grid { background: transparent !important; }

        /* ─── PAGE HERO ─── */
        .page-hero {
            background-color: #0c1a2b;
            padding: 50px 0 50px;
            position: relative;
            overflow: hidden;
        }

        .page-hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 320px; height: 320px;
            border-radius: 50%;
            background: rgba(201, 168, 76, 0.08);
            pointer-events: none;
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(201, 168, 76, 0.15);
            border: 1px solid rgba(201, 168, 76, 0.3);
            color: var(--gold-light);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 100px;
            margin-bottom: 14px;
        }

        .hero-eyebrow::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--gold);
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--white);
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .hero-subtitle {
            color: rgba(255,255,255,0.55);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            flex: 1;
            padding: 48px 0 64px;
            background: #faf8f3 !important;
        }

        /* ─── BATCH TABS ─── */
        .batch-nav {
            display: flex;
            gap: 6px;
            padding: 6px;
            background: var(--white);
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(15, 31, 61, 0.07);
            margin-bottom: 36px;
            width: fit-content;
        }

        .batch-tab {
            position: relative;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-mid);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .batch-tab:hover {
            color: var(--navy);
            background: rgba(15, 31, 61, 0.04);
        }

        .batch-tab.active {
            background: var(--navy);
            color: var(--white);
            box-shadow: 0 2px 12px rgba(15, 31, 61, 0.3);
        }

        .batch-tab .tab-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(201, 168, 76, 0.2);
            color: var(--gold);
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 100px;
            padding: 1px 7px;
            margin-left: 7px;
            vertical-align: middle;
        }

        .batch-tab.active .tab-badge {
            background: rgba(201, 168, 76, 0.25);
            color: var(--gold-light);
        }

        /* ─── BATCH PANEL ─── */
        .batch-panel { display: none; }
        .batch-panel.active { display: block; animation: fadeSlideUp 0.35s ease; }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ─── STUDENT GRID ─── */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        /* ─── STUDENT CARD ─── */
        .student-card {
            background: var(--white);
            border: 1px solid rgba(15, 31, 61, 0.07);
            border-radius: var(--radius);
            padding: 20px 20px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .student-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, var(--gold), var(--gold-light));
            opacity: 0;
            transition: opacity 0.25s ease;
            border-radius: 3px 0 0 3px;
        }

        .student-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--border);
        }

        .student-card:hover::before { opacity: 1; }

        .student-info {
            flex: 1;
            min-width: 0;
        }

        .student-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.3;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .student-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .student-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 7px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .student-link:hover { transform: translateY(-2px); }

        .student-link.email {
            background: rgba(201, 168, 76, 0.1);
            color: var(--gold);
        }

        .student-link.email:hover {
            background: var(--gold);
            color: var(--white);
        }

        .student-link.linkedin {
            background: rgba(10, 102, 194, 0.08);
            color: #0a66c2;
        }

        .student-link.linkedin:hover {
            background: #0a66c2;
            color: var(--white);
        }

        .student-link.github {
            background: rgba(36, 41, 47, 0.08);
            color: #24292f;
        }

        .student-link.github:hover {
            background: #24292f;
            color: var(--white);
        }

        .student-link svg {
            width: 15px;
            height: 15px;
        }

        .student-link.no-link {
            opacity: 0.25;
            pointer-events: none;
        }

        /* hidden by search */
        .student-card.hidden { display: none; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            .students-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 580px) {
            .batch-nav { flex-wrap: wrap; }
            .students-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

/* ── HELPERS ────────────────────────────────────── */
function buildCard(student) {
    const emailLink = `<a href="mailto:${student.email}" class="student-link email" title="Send email">${ICONS.email}</a>`;
    const liLink    = student.linkedin
        ? `<a href="${student.linkedin}" class="student-link linkedin" target="_blank" rel="noopener noreferrer" title="LinkedIn">${ICONS.linkedin}</a>`
        : `<span class="student-link linkedin no-link" title="LinkedIn not available">${ICONS.linkedin}</span>`;
    const ghLink    = student.github
        ? `<a href="${student.github}" class="student-link github" target="_blank" rel="noopener noreferrer" title="GitHub">${ICONS.github}</a>`
        : `<span class="student-link github no-link" title="GitHub not available">${ICONS.github}</span>`;

    return `
    <div class="student-card" data-name="${student.name.toLowerCase()}">
        <div class="student-info">
            <div class="student-name">${toTitleCase(student.name)}</div>
            <div class="student-links">${emailLink}${liLink}${ghLink}</div>
        </div>
    </div>`;
}

function toTitleCase(str) {
    return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

/* ── RENDER ─────────────────────────────────────── */
function renderAll() {
    Object.entries(BATCHES).forEach(([year, students]) => {
        const panel = document.getElementById('panel-' + year);
        if (!panel) return;
        const grid = panel.querySelector('.students-grid');
        grid.innerHTML = students.map(buildCard).join('');
    });
}

/* ── TABS ───────────────────────────────────────── */
document.querySelectorAll('.batch-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.batch-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.batch-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        const year = tab.dataset.batch;
        document.getElementById('panel-' + year).classList.add('active');
    });
});

renderAll();
</script>
